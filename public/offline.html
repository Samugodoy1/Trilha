<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sem conexão · Trilha</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fff; color: #000;
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } p { color: #98989f !important; } }
  img { width: 64px; height: 64px; margin-bottom: 20px; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: #6e6e73; margin: 0 0 24px; max-width: 320px; }
  button { font: inherit; font-weight: 600; color: #fff; background: #007aff; border: 0; border-radius: 999px; padding: 12px 28px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon.svg" alt="" />
    <h1>Sem conexão</h1>
    <p>Por segurança, os dados dos alunos não ficam guardados no aparelho. Assim que a internet voltar, tudo aparece de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
